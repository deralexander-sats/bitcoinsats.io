<header class="bar">
  <div class="bar-in">
    <a class="logo" href="/" aria-label="bitcoinsats.io Startseite">
      <img class="logo-light" src="/images/logo.svg" alt="" width="120" height="34">
      <img class="logo-dark" src="/images/logo-dark.svg" alt="" width="120" height="34">

    </a>
    <div class="bar-actions">
      <button class="ic" id="theme" type="button" aria-label="Darstellung wechseln">☾</button>
      <button class="menu-btn" id="menubtn" type="button" aria-expanded="false" aria-controls="menu">
        <span class="burger" aria-hidden="true"></span><span class="menu-label">Menü</span>
      </button>
    </div>
  </div>
  <nav class="menu" id="menu" aria-label="Hauptmenü" hidden>
    <a href="/">Startseite</a>
{% for tool in site.data.tools %}{% unless tool.soon %}    <a href="{{ tool.url }}">{{ tool.title }}</a>
{% endunless %}{% endfor %}    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
